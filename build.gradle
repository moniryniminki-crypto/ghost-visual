plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'java'
}

group = 'com.ghostvisual'
version = '0.1.0'
archivesBaseName = 'ghost-visual'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    minecraft_version = '1.21.11'
    fabric_loader_version = '0.14.21'
    fabric_api_version = '0.89.7+1.21.11'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.1"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // For simple JSON config serialization
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Loom defaults are usually enough; keep build simple

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
